<style>*{box-sizing:border-box}

button:hover{filter:brightness(1.25)}button:disabled{opacity:.4;cursor:default}button.on{background:linear-gradient(var(--acc2),color-mix(in srgb,var(--acc2) 60%,#000));border-color:var(--acc)}

kbd{background:#0006;border:1px solid #fff4;border-radius:3px;padding:0 4px;font-size:10px}

.mm{border:1px solid #0008;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.8}

#center{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:flex-end}

.pt{display:flex;justify-content:space-between;cursor:pointer;white-space:nowrap;overflow:hidden}.pt b{overflow:hidden;text-overflow:ellipsis}
.st{color:#ffd54f}
.hpb{height:6px;background:#0009;border-radius:3px;overflow:hidden;margin:3px 0}.hpb i{display:block;height:100%;background:#2ecc71}

.mini{padding:0 5px;margin-left:auto}

.sk button[data-cd]:not([data-cd=""])::after,.fbtn[data-cd]:not([data-cd=""])::after{content:attr(data-cd);position:absolute;inset:0;background:#000b;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#ffd54f}

#bench{display:flex;gap:5px}

#right{width:300px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
#wslots,#wstore{display:flex;gap:4px;align-items:center}#wstore small{font-size:10px;color:#99a;width:26px}
.ws{width:42px;height:38px;border:1px dashed #556;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#667;cursor:pointer}
.ws.has{border:2px solid var(--r);color:#fff;background:linear-gradient(var(--bg2),var(--bg))}.ws.has b{font-size:17px;line-height:1}.ws.has span{color:var(--acc);font-size:9px}.ws.lock{opacity:.4}.ws.st{width:36px;height:30px}.ws.st.has b{font-size:14px}
#btnRow{display:flex;flex-wrap:wrap;gap:4px}#btnRow button{position:relative;width:44px;height:38px;font-size:20px;padding:0}
#btnRow .badge{position:absolute;top:-5px;right:-5px;font-size:10px}
.badge{background:#e74c3c;border-radius:8px;padding:0 5px;font-style:normal}
.blink{animation:bl 1s infinite}@keyframes bl{50%{box-shadow:0 0 10px #ffd54f}}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;z-index:5}

.pbox{width:980px;max-height:560px;background:var(--pat),linear-gradient(var(--bg2),var(--panel) 60px);border:2px solid var(--line);border-radius:12px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent),0 10px 40px #000a;display:flex;flex-direction:column}
.p-hero .pbox{width:620px}.p-build .pbox{width:820px}.p-cards .pbox{width:860px}
.phead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;font-family:var(--hfont);color:var(--acc);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--civ) 22%,transparent),transparent)}
.phead span::before,.phead span::after{content:var(--orn);margin:0 8px;opacity:.75;font-size:13px}
#pbody{overflow:auto;padding:10px 14px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.note{color:#aab;font-size:11px}
h3{margin:10px 0 4px;font-size:13px;color:var(--acc);font-family:var(--hfont)}h2{margin:4px 0;font-family:var(--hfont)}
.tag{border-radius:8px;padding:1px 6px;font-size:10px;color:#fff}

.hc{position:relative;width:180px;background:linear-gradient(color-mix(in srgb,var(--g,var(--r)) 18%,var(--bg2)),var(--bg) 70%);border:2px solid var(--r);border-top:5px solid var(--g,var(--r));border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px}
.hc small{font-size:10px;color:#ccd}.hc .sk{display:block;color:#9fd3ff}.hc .pas{color:#ffd54f}.hc .own{color:#7bed9f}.hc button{margin-top:auto}
.hc.empty{align-items:center;justify-content:center;color:#667;border-style:dashed;min-height:150px}
.lk{position:absolute;right:5px;top:3px;cursor:pointer}
.smith,.wl{display:flex;flex-wrap:wrap;gap:5px}.sm{background:#1b2642;border:1px solid var(--r,#334);border-radius:6px;padding:3px 6px;display:flex;gap:6px;align-items:center}
.board{display:flex;gap:10px}.br{flex:1}.bh{font-weight:700;font-size:13px;margin-bottom:3px}
.tier{display:flex;gap:2px;align-items:center;margin-bottom:3px}.tier.locked{opacity:.35}.tn{width:20px;font-size:10px;color:#99a}
.cell{position:relative;width:27px;height:27px;border:1px solid var(--c);border-radius:4px;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#0006;text-align:center;line-height:1}
.cell.lv{background:color-mix(in srgb,var(--c) 55%,#000)}.cell.ks{border-radius:50%;border-width:2px}.cell.sug{box-shadow:0 0 0 2px #ffd54f}.cell.syn{border-style:double;border-width:3px}
.cell i{position:absolute;right:1px;bottom:0;font-size:9px;font-style:normal;color:#ffd54f;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:6px}.tools button{display:flex;flex-direction:column;align-items:center;min-width:72px;padding:4px 6px}.tools button b{font-size:24px;line-height:1.1}.tools small{font-size:10px;color:#ccd}
.tabs{display:flex;gap:4px;margin-bottom:6px}

.card{position:relative;width:260px;min-height:120px;background:var(--pat),linear-gradient(var(--bg2),var(--bg));border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;transition:transform .1s;text-align:center}
.card:hover{transform:translateY(-4px);border-color:#fff}.card.gold{border-color:#ffd54f;background:linear-gradient(#5a4512,#2b2210)}
.card .ci{display:block;font-size:34px;line-height:1.1}
.card b{display:block;font-size:15px;margin:3px 0;font-family:var(--hfont)}.card small{position:absolute;left:8px;top:6px;color:#9fd3ff}.card p{margin:4px 0;color:#dde}
.rep{background:#1e3a2a;border:1px solid #2ecc71;border-radius:8px;padding:8px;margin-bottom:8px}.rep.bad{background:#3a1e22;border-color:#e74c3c}
.hdet h2{color:var(--r)}.eqs{background:#0006;border-radius:4px;padding:3px 8px}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0000,#000a);z-index:6}

.mbox h1{margin:0;text-align:center;font-size:40px;letter-spacing:3px;color:#ffd54f;text-shadow:0 3px 0 #7a4c00,0 0 20px #ffb300aa}

.mbtns{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}.mbtns.col{flex-direction:column;align-items:stretch}
.prof{text-align:center;color:#99a;font-size:12px}
.diffs{display:flex;gap:8px}.dcard{flex:1;background:#1b2642;border:2px solid #334;border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:12px}
.dcard.on{border-color:#ffd54f}.dcard.lock{opacity:.4;cursor:default}
.muts{display:flex;flex-direction:column;gap:3px;font-size:12px}.mut{cursor:pointer}.mut.on{color:#ffd54f}
.civs{display:flex;gap:8px}.ccard{flex:1;background:linear-gradient(color-mix(in srgb,var(--c) 22%,var(--bg2)),var(--bg) 75%);border:2px solid #334;border-top:6px solid var(--c);border-radius:8px;padding:8px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ccard.on{border-color:#ffd54f;border-top-color:var(--c);box-shadow:0 0 16px #ffd54f66}.ccard .ch{display:flex;justify-content:space-between;font-size:15px}.ccard .pas{color:#ffd54f}.ccard .key{color:#9fd3ff}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.zc{min-height:84px;border:2px solid #0008;border-radius:8px;padding:6px;cursor:pointer;font-size:11px;text-shadow:0 1px 2px #000;display:flex;flex-direction:column;gap:3px}
.zc.on{border-color:#ffd54f;box-shadow:0 0 12px #ffd54f}.zc.ours{outline:3px solid #ffd54f}.zc.boss{background:#2b1530;align-items:center;justify-content:center;cursor:default}
.slots{display:flex;flex-direction:column;gap:6px}.slot{background:#1b2642;padding:6px;border-radius:6px;display:flex;gap:8px;align-items:center}
.help{font-size:12px}.help ol{padding-left:18px}.keys td{padding:2px 8px}.keys td:nth-child(odd){color:#ffd54f;font-weight:700}
#toasts{position:absolute;top:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:7}
.toast{background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:13px;transition:opacity .5s;max-width:700px;text-align:center}.toast.out{opacity:0}

.civs.all{flex-wrap:wrap}.civs.all .ccard{flex:0 0 calc(20% - 7px)}
.civs.all .ccard{padding:6px;gap:2px;font-size:10.5px}.civs.all .ccard .pas{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mbox .mbtns{position:sticky;bottom:-18px;background:#0d1424f2;padding:8px 0;margin-bottom:-6px}
.mbox{background:var(--pat),linear-gradient(var(--bg2),var(--bg));border-color:var(--line)}.mbox .mbtns{background:color-mix(in srgb,var(--bg) 95%,transparent)}
.mbox h1{font-family:var(--hfont);color:var(--acc)}
/* ---- Hướng dẫn tương tác ---- */
#coach{position:absolute;top:48px;right:10px;width:340px;z-index:8;display:flex;gap:10px;align-items:flex-start;background:var(--pat),linear-gradient(var(--bg2),var(--bg));border:2px solid var(--acc);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px #000c,0 0 18px color-mix(in srgb,var(--acc) 35%,transparent);transition:top .25s,left .25s,right .25s}
#coach.left{right:auto;left:10px;transition:none}#coach.top{transition:none}#coach.top{top:2px;left:50%;right:auto;transform:translateX(-50%);width:520px}
#coach .cIco{font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px #000)}
#coach .cBody{flex:1;font-size:12.5px;line-height:1.35}
#coach .cTitle{display:block;font-family:var(--hfont);font-size:15px;color:var(--acc);margin-bottom:2px}

#coach .cProg{position:absolute;right:10px;top:6px;font-size:10px;color:#aab}
#coach .cSkip{background:none;border:none;color:#99a;text-decoration:underline;padding:0;font-size:11px}
#tutHi{position:absolute;z-index:8;pointer-events:none;border:3px solid var(--acc);border-radius:10px;box-shadow:0 0 0 4000px #0000,0 0 16px var(--acc);animation:tutP 1s infinite}
#tutHi.round{border-radius:50%}
#tutHi::after{content:"👇";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:26px;animation:tutB .7s infinite alternate}

@keyframes tutP{50%{box-shadow:0 0 0 4000px #0000,0 0 26px var(--acc);border-color:#fff}}
@keyframes tutB{to{margin-top:-8px}}
.tutDone{animation:tutOk .6s}@keyframes tutOk{from{scale:1.06}}
.fbtn[data-cd]::after{border-radius:50%/40%}

let G = null;          // trạng thái lưu được (JSON thuần)
let M = {};            // chỉ số tổng hợp, tính lại khi có thay đổi
const R = {};          // dữ liệu runtime (map, thực thể) — không lưu

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wpick(weights, r = Math.random) { const tot = weights.reduce((s, w) => s + w, 0); let x = r() * tot; for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; } return weights.length - 1; }
let UID = 1; const uid = () => (G ? ++G.uid : ++UID);
const civ = () => CIV[G.civ];
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : Math.floor(n);
const costStr = c => Object.entries(c).map(([k, v]) => `${v} ${k === 'gold' ? '💰' : k === 'dia' ? '💎' : k === 'core' ? '🔋' : RES[k].i}`).join(' ');
function canPay(c) { return Object.entries(c).every(([k, v]) => (G.res[k] || 0) >= v); }
function pay(c) { if (!canPay(c)) return false; for (const [k, v] of Object.entries(c)) G.res[k] -= v; return true; }
function gain(k, v) {
  if (k === 'rice' && G.riceDebt > 0) { const p = Math.min(v, G.riceDebt); G.riceDebt -= p; v -= p; if (G.riceDebt <= 0) { G.riceDebt = 0; recalc(); } }
  G.res[k] = (G.res[k] || 0) + v;
  if (RES[k] && G.res[k] > CONFIG.CAP) { const ex = G.res[k] - CONFIG.CAP; G.res[k] = CONFIG.CAP; G.overflow += ex; const rate = M.ksGranary ? 5 : CONFIG.OVERFLOW_RATE; if (G.overflow >= rate) { const g = Math.floor(G.overflow / rate); G.res.gold += g; G.overflow -= g * rate; } }
}

const SFX = { ctx: null, on: true };
function sfx(type) {
  if (!SFX.on) return;

    if (!SFX.ctx) SFX.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const c = SFX.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    const P = { shoot: ['triangle', 880, 440, .05, .03], hit: ['square', 200, 90, .06, .04], kill: ['square', 420, 120, .12, .05], coin: ['sine', 900, 1500, .1, .06], build: ['triangle', 300, 600, .15, .08], ui: ['sine', 660, 660, .05, .04], skill: ['sawtooth', 160, 640, .35, .07], boom: ['sawtooth', 120, 40, .4, .1], bad: ['square', 220, 110, .3, .07], night: ['sine', 300, 150, .8, .08], day: ['sine', 400, 800, .6, .07], star: ['triangle', 600, 1200, .3, .07] }[type] || ['sine', 500, 500, .05, .03];
    o.type = P[0]; o.frequency.setValueAtTime(P[1], t); o.frequency.exponentialRampToValueAtTime(Math.max(30, P[2]), t + P[3]);
    g.gain.setValueAtTime(P[4], t); g.gain.exponentialRampToValueAtTime(.0001, t + P[3]);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + P[3] + .02);
  } catch (e) { }
}

function boardStats() {

}

// Tòa Văn Minh: vẽ theo phong cách văn minh & thời đại
function makeTowerTexture(s, civId, age) {
  const C = CIV[civId], col = C.color, key = `tower_${civId}_${age}`;
  if (s.textures.exists(key)) return key;
  const style = { jpn: 'asia', chn: 'asia', kor: 'asia', vn: 'vn', ara: 'dome', ott: 'dome', byz: 'dome', egy: 'pyr', maya: 'pyr', vik: 'hall' }[civId] || 'castle';
  tex(s, key, 120, 140, g => {
    g.fillStyle(0x000000, .3); g.fillEllipse(60, 126, 112, 26);
    const stone = style === 'pyr' ? 0xd8b26e : style === 'hall' ? 0x8d6e63 : 0xa4a4a4;
    if (style === 'vn') {
      // lũy tre → thành đất → Cổ Loa xoắn ốc
      const rings = Math.min(3, age);
      for (let i = rings; i >= 1; i--) { g.lineStyle(7, age === 1 ? 0x6aa84f : 0x9c6b3e); g.strokeEllipse(60, 104, 40 + i * 22, 16 + i * 8); }
      if (age === 1) { g.fillStyle(0x7fb03c); for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; g.fillRect(60 + Math.cos(a) * 50 - 1, 96 + Math.sin(a) * 18 - 14, 3, 16); } }
    }
    const floors = age; const bw = 64, fh = 16;
    let y = 112;
    for (let f = 0; f < floors; f++) {
      const w = bw - f * 8; g.fillStyle(shade(stone, .78 + f * .05)); g.fillRect(60 - w / 2, y - fh, w, fh);
      g.fillStyle(shade(stone, .55)); for (let i = 0; i < w / 10; i++) g.fillRect(60 - w / 2 + 3 + i * 10, y - fh + 5, 4, 6);
      if (style === 'asia' || style === 'vn') { g.fillStyle(col); g.fillTriangle(60 - w / 2 - 10, y - fh + 2, 60, y - fh - 9, 60 + w / 2 + 10, y - fh + 2); }
      y -= fh + (style === 'asia' || style === 'vn' ? 7 : 0);
    }
    if (style === 'castle') { g.fillStyle(shade(stone, .9)); for (let i = 0; i < 5; i++) g.fillRect(60 - 26 + i * 12, y - 10, 7, 10); g.lineStyle(2, 0x4e342e); g.lineBetween(60, y - 10, 60, y - 38); g.fillStyle(col); g.fillTriangle(61, y - 38, 82, y - 31, 61, y - 24); }
    if (style === 'dome') { g.fillStyle(col); g.fillCircle(60, y, 20); g.fillStyle(0xf1c40f); g.fillRect(58, y - 32, 4, 14); g.fillCircle(60, y - 34, 3); }
    if (style === 'pyr') { g.fillStyle(0xe0c07a); g.fillTriangle(30, y + 4, 60, y - 34, 90, y + 4); g.fillStyle(col); g.fillTriangle(54, y - 26, 60, y - 34, 66, y - 26); }
    if (style === 'hall') { g.fillStyle(0x5d4037); g.fillTriangle(22, y + 2, 60, y - 30, 98, y + 2); g.lineStyle(3, col); g.lineBetween(26, y, 16, y - 14); g.lineBetween(94, y, 104, y - 14); }
    if (style === 'asia' || style === 'vn') { g.fillStyle(col); g.fillRect(58, y - 12, 4, 12); g.fillStyle(0xf1c40f); g.fillCircle(60, y - 14, 4); }
    g.fillStyle(0x3e2723); g.fillRoundedRect(52, 96, 16, 16, { tl: 8, tr: 8, bl: 0, br: 0 });
  });
  return key;
}

// ---------- Sinh map theo seed ----------
function genMap(seed, zone) {
  const r = mulberry32(seed + zone * 7919), MW = CONFIG.MW, MH = CONFIG.MH, cx = 24, cy = 15;
  const spots = []; let g = 0;
  while (spots.length < 8 && g++ < 800) { const x = 17 + Math.floor(r() * 14), y = 10 + Math.floor(r() * 10); if (spots.every(s => Math.abs(s.x - x) + Math.abs(s.y - y) >= 4)) spots.push({ x, y }); }
  const types = ['rice', 'wood', 'stone', 'iron'], Z = ZONES[zone], wts = types.map(t => Z.res[t]);
  const n = 5 + Math.floor(r() * 2), mines = []; g = 0;
  while (mines.length < n && g++ < 4000) {
    const type = mines.length < 4 ? types[(mines.length + Math.floor(r() * 4)) % 4] : types[wpick(wts, r)];
    if (mines.length < 4 && mines.some(m => m.type === type)) continue;
    const x = 3 + Math.floor(r() * (MW - 6)), y = 3 + Math.floor(r() * (MH - 6)), d = Math.hypot(x - cx, y - cy);
    if (d < 8 || d > 19) continue; if (mines.some(m => Math.hypot(m.x - x, m.y - y) < 6)) continue; if (spots.some(s => Math.hypot(s.x - x, s.y - y) < 5)) continue;
    mines.push({ id: mines.length, x, y, type });
  }
  const sides = shuffle([0, 1, 2, 3]).slice(0, 2 + (r() < .5 ? 1 : 0)), entries = [];
  for (const sd of sides) { const t = .25 + r() * .5; entries.push(sd === 0 ? { x: Math.floor(t * MW), y: 0 } : sd === 1 ? { x: MW - 1, y: Math.floor(t * MH) } : sd === 2 ? { x: Math.floor(t * MW), y: MH - 1 } : { x: 0, y: Math.floor(t * MH) }); }
  const decorKeys = { valley: ['tree', 'flower', 'flower', 'rock'], snow: ['pine', 'pine', 'rock'], boulder: ['redrock', 'redrock', 'rock'], ruins: ['scrap', 'scrap', 'rock'], forest: ['tree', 'tree', 'tree', 'pine'], desert: ['cactus', 'rock', 'cactus'], river: ['tree', 'flower', 'reed'], swamp: ['reed', 'reed', 'water', 'tree'] }[Z.fx];
  const decor = [];
  for (let i = 0; i < 150; i++) {
    const x = r() * MW * T, y = r() * MH * T;
    if (Math.hypot(x - cx * T, y - cy * T) < 7 * T) continue;
    if (mines.some(m => Math.hypot(tc(m.x) - x, tc(m.y) - y) < 60)) continue;
    decor.push({ x, y, k: decorKeys[Math.floor(r() * decorKeys.length)], s: .8 + r() * .6 });
  }
  const patches = []; for (let i = 0; i < 260; i++) patches.push({ x: r() * MW * T, y: r() * MH * T, w: 10 + r() * 40, h: 6 + r() * 20 });
  return { spots, mines, entries, decor, patches, r };
}

function placeTower(tile, loaded) {

  R.towerLbl = S.add.text(R.tower.x, R.tower.y + 44, civ().tower, { fontFamily: 'Arial', fontSize: '12px', color: '#ffe082', stroke: '#000', strokeThickness: 3 }).setOrigin(.5).setDepth(120);
  World.rebuildTower();
  S.light.setPosition(R.tower.x, R.tower.y);
  S.cameras.main.centerOn(R.tower.x, R.tower.y + 60);
  rebuildBelts(); rebuildTraps(); rebuildSubs();
  // dàn tướng đã đặt (khi tải game)

function computeLanes() {
  const r = mulberry32(G.seed * 3 + G.towerTile.x * 31 + G.towerTile.y * 7), B = R.tower;
  R.lanes = R.map.entries.map((e, id) => {
    const A = { x: tc(e.x), y: tc(e.y) }, pts = [A], dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
    for (const f of [.33, .66]) { const j = (r() * 2 - 1) * 110; pts.push({ x: A.x + dx * f + nx * j, y: A.y + dy * f + ny * j }); }
    const last = pts[pts.length - 1], d2 = Math.hypot(B.x - last.x, B.y - last.y), k = (d2 - CONFIG.TOWER.r - 12) / d2;
    pts.push({ x: last.x + (B.x - last.x) * k, y: last.y + (B.y - last.y) * k });
    const segs = []; let total = 0; for (let i = 0; i < pts.length - 1; i++) { const l = dist(pts[i], pts[i + 1]); segs.push(l); total += l; }
    return { id, pts, segs, total, fence: null, flood: false };
  });
  // Ô đặc biệt Việt Nam: Rừng Tre & Đầm lầy dọc làn (bẫy +25%)
  R.special = [];
  if (G.civ === 'vn') for (const l of R.lanes) for (let i = 0; i < 3; i++) { const p = lanePos(l, l.total * (.25 + i * .22) + r() * 30); R.special.push({ x: p.x, y: p.y, k: i % 2 ? 'bamboo' : 'water' }); }

function lanePos(l, s) {

  return l.pts[l.pts.length - 1];
}
function distToLane(l, x, y) {

}

  R.report = { wave: G.wave, win: true, gold, kills: R.kills, upkeep: u, hungry, timeUp, kc: R.kcGain || 0 };

// ---------- Sinh wave ----------
function genWave(w) {
  const fac = FAC_ORDER[(w - 1) % 4], F = FACTIONS[fac], D = diffObj();
  const units = F.units.filter(u => MONS[u].minW <= w), wts = units.map(u => MONS[u].wgt);
  const zf = ZONE().fac && ZONE().fac !== fac && w >= 2 ? FACTIONS[ZONE().fac].units.filter(u => MONS[u].minW <= w) : null;
  const n = Math.round(10 + 5 * w), nL = Math.min(R.lanes.length, w <= 1 ? 1 : w <= 3 ? 2 : 3);
  const lanes = shuffle(R.lanes.map(l => l.id)).slice(0, nL);
  const dur = (24 + 6 * w) * (G.mut.longNight ? 1.3 : 1), q = [];
  for (let i = 0; i < n; i++) { const type = zf && Math.random() < .2 ? pick(zf) : units[wpick(wts)]; q.push({ t: 2 + i / n * dur + rnd(0, 1.5), type, lane: lanes[i % lanes.length] }); }
  if (D.eliteEvery && w % D.eliteEvery === 0) q.push({ t: dur * .7, type: pick(units), lane: pick(lanes), elite: true });
  q.sort((a, b) => a.t - b.t);

}

// ---------- Cập nhật mỗi frame ----------

  else if (G.phase === 'day') { if (!Tut.holds()) { R.phaseT -= dt; scoutUpdate(dt); } economyUpdate(dt); if (R.phaseT <= 0) startDusk(); }
  else if (G.phase === 'dusk') { if (!Tut.holds()) R.phaseT -= dt; economyUpdate(dt); if (R.phaseT <= 0) startNight(); }
  else if (G.phase === 'night') {

    while (R.plan && R.spawnIdx < R.plan.q.length && R.plan.q[R.spawnIdx].t <= R.nightT) { const e = R.plan.q[R.spawnIdx++]; spawnMon(e.type, R.lanes[e.lane], e.elite); }

  // ánh sáng ngày/đêm

  S.overlay.fillColor = target[0]; S.overlay.fillAlpha += (target[1] - S.overlay.fillAlpha) * Math.min(1, dt * 2);
  const la = G.phase === 'night' ? .35 : G.phase === 'dusk' ? .15 : 0; S.light.alpha += (la - S.light.alpha) * Math.min(1, dt * 2);
  if (R.sandstorm && G.phase === 'night') { S.overlay.fillColor = 0x6b4a1a; }
  UI.tick(delta);
}
function nightEnv(dt) {

  if (fx === 'boulder') { R.boulderT -= dt; if (R.boulderT <= 0) { R.boulderT = 18; rollBoulder(); } }
  if (hasW('clock') && hasW('clock').star >= 3 && !R.clockDone && R.nightT > 20) { R.clockDone = true; for (const m of R.monsters) m.stun = Math.max(m.stun, 3); toast('⏳ Đồng Hồ Thời Gian: đóng băng quái 3s'); vis({ type: 'ring', x: R.tower.x, y: R.tower.y, r0: 20, r1: 900, color: 0x74b9ff, dur: .8 }); }
}
function cameraUpdate(delta) {
  const cam = S.cameras.main, sp = .6 * delta / cam.zoom, k = R.keys; if (!k) return;
  if (k.left.isDown) cam.scrollX -= sp; if (k.right.isDown) cam.scrollX += sp; if (k.up.isDown) cam.scrollY -= sp; if (k.down.isDown) cam.scrollY += sp;

World.centerCam = () => { if (R.tower) S.cameras.main.pan(R.tower.x, R.tower.y + 60, 300); };

// ---------- Kinh tế: máy khai thác & băng chuyền ----------
function towerRing(x, y) { const c = Math.max(Math.abs(x - G.towerTile.x), Math.abs(y - G.towerTile.y)); return c; }

function economyUpdate(dt) {

  }

// ---------- Vẽ lại băng chuyền / bẫy / tháp phụ ----------

}

// ---------- Xây dựng (công cụ B) ----------
World.setTool = t => { R.tool = (R.tool === t ? null : t); R.placing = null; S.hoverG.clear(); UI.refresh(); };
function buildOK() { if (G.phase === 'night' || G.phase === 'end') { toast('Chỉ xây được ban ngày/hoàng hôn'); return false; } return true; }
function tileFree(x, y) { return x >= 0 && y >= 0 && x < CONFIG.MW && y < CONFIG.MH && towerRing(x, y) > 1 && !G.belt[tkey(x, y)] && !R.map.mines.some(m => m.x === x && m.y === y); }
function applyTool(tx, ty, wx, wy) {

    else if (e.lvl < 3) { const c = CONFIG.EXTR[e.lvl + 1].cost; if (!pay(c)) return toast('Thiếu: ' + costStr(c)); e.lvl++; toast(`Máy Khai Thác cấp ${e.lvl}`); }

function deleteAt(tx, ty, wx, wy) {

  let e = null, id = null;
  if (m && G.ext[m.id] && G.ext[m.id].path.length === 1) { e = G.ext[m.id]; id = m.id; }
  else for (const i in G.ext) { const p = G.ext[i].path, l = p[p.length - 1]; if (l[0] === tx && l[1] === ty) { e = G.ext[i]; id = +i; } }
  if (!e) { if (m && !G.ext[m.id]) toast('Đặt Máy Khai Thác lên mỏ trước'); else toast('Kéo từ máy khai thác hoặc cuối băng chuyền'); return false; }

// ---------- Input chuột ----------
function onDown(p) {

// ---------- Đồng minh (triệu hồi, dân quân) ----------
function spawnAlly(kind, x, y, dur, srcRt) {

  let hp = def.hp * (1 + M.sumHp + buffSum('allyHp')) * (1 + .1 * G.wave), atk = def.atk * (1 + .08 * G.wave);
  if (G.heroes.some(h => h.id === 'barba' && h.loc === 'field')) { const b = [...R.heroRT.values()].find(r => r.h.id === 'barba'); if (b) { hp += b.st.hp * .2; atk += b.st.atk * .2; } }
  const a = { kind, def, x, y, hp, maxHp: hp, atk, until: M.ksArmy || kind === 'militia' ? 1e9 : R.time + dur * (1 + M.sumDur), atkCd: 0, stealth: kind === 'militia', revealT: 0, shield: 0, home: { x: R.tower.x + rnd(-90, 90), y: R.tower.y + rnd(30, 100) } };

function damageAlly(a, d) { if (a.dead) return; d *= 100 / (100 + a.def.arm * 2); if (a.shield > 0) { const k = Math.min(a.shield, d); a.shield -= k; d -= k; } a.hp -= d; if (a.hp <= 0) { if (a.kind === 'golem' && hasW('golemgate') && hasW('golemgate').star >= 3) { for (const m of inRange(a.x, a.y, 90, false)) applyStun(m, 1); burst('brown', a.x, a.y, 20); } burst('grey', a.x, a.y, 8); removeAlly(a); } }
function allyUpdate(a, dt) {
  if (a.until < R.time) { removeAlly(a); return; }
  a.atkCd -= dt;
  if (a.kind === 'militia' && !a.stealth && a.revealT < R.time) { a.stealth = true; a.spr.setAlpha(.45); }
  const m = aiTarget(a, 520);
  const spd = a.def.spd * dt;

    const d = Math.hypot(m.x - a.x, m.y - a.y);
    if (d > a.def.rng + 8) { a.x += (m.x - a.x) / d * spd; a.y += (m.y - a.y) / d * spd; }

      if (a.def.ranged) shoot('p_bolt', a, m, 480, () => dealDamage(m, dmg, { dt: 'phys' })); else dealDamage(m, dmg, { dt: 'phys' });
    }
  } else { const d = Math.hypot(a.home.x - a.x, a.home.y - a.y); if (d > 5) { a.x += (a.home.x - a.x) / d * spd; a.y += (a.home.y - a.y) / d * spd; } }
  a.spr.setPosition(a.x, a.y).setDepth(10 + a.y / 10);
}

// ---------- Lính trên tòa, tháp phụ, vũ khí ----------

      case 'oil': { const ms = inRange(R.tower.x, R.tower.y, d.r + CONFIG.TOWER.r, false); if (!ms.length) { R.wcd[w.uid] = .3; break; } R.wcd[w.uid] = d.cd; for (const m of ms) { m.burn = { dps: d.dps * pw, until: R.time + d.dur, tick: .5 }; if (w.star >= 3) m.oiled = R.time + d.dur; } vis({ type: 'ring', x: R.tower.x, y: R.tower.y, r0: 40, r1: d.r + 40, color: 0x8d6e63, dur: .5 }); break; }

function castFxLine(o, a, len, w, dmg, max, dt = 'phys', color = 0xcfd8dc, blind) { let n = 0; const x1 = o.x + Math.cos(a) * len, y1 = o.y + Math.sin(a) * len; for (const m of alive().sort((p, q) => Math.hypot(p.x - o.x, p.y - o.y) - Math.hypot(q.x - o.x, q.y - o.y))) { const t = clamp(((m.x - o.x) * (x1 - o.x) + (m.y - o.y) * (y1 - o.y)) / (len * len), 0, 1); if (Math.hypot(m.x - (o.x + (x1 - o.x) * t), m.y - (o.y + (y1 - o.y) * t)) < w) { if (n++ >= max) break; dealDamage(m, dmg, { dt }); m.armRed = .15; m.armRedT = R.time + 4; if (blind) applyStun(m, 1); } } vis({ type: 'line', x1: o.x, y1: o.y, x2: x1, y2: y1, w: 4, color, dur: .25 }); }

function placeMines(w) { for (const b of R.bombs) b.spr.destroy(); R.bombs = []; const n = w.star >= 3 ? 6 : 4; for (let i = 0; i < n; i++) { const l = R.lanes[i % R.lanes.length]; const p = lanePos(l, l.total - 90 - Math.random() * 220); R.bombs.push({ x: p.x, y: p.y, dmg: WEAPON.mines.dmg * STAR_MULT[w.star], chain: w.star >= 3, spr: S.add.image(p.x, p.y, 'bomb').setDepth(4) }); } toast(`💣 Đặt ${n} mìn thuốc súng`); }
function explodeBomb(b) { if (b.done) return; b.done = true; b.spr.destroy(); for (const m of inRange(b.x, b.y, 70, false)) dealDamage(m, b.dmg * (1 + .08 * G.wave), { dt: 'fire', aoe: 1, show: 1 }); burst('orange', b.x, b.y, 25); vis({ type: 'ring', x: b.x, y: b.y, r0: 10, r1: 70, color: 0xff7043, dur: .3 }); sfx('boom'); if (b.chain) for (const o of R.bombs) if (!o.done && Math.hypot(o.x - b.x, o.y - b.y) < 160) setTimeoutGame(.15, () => explodeBomb(o)); }
function placeFence(w) { const l = R.plan ? R.lanes[R.plan.lanes[0]] : R.lanes[0]; const s = l.total - 130, p = lanePos(l, s); const f = { x: p.x, y: p.y, s, hp: WEAPON.fence.hp * STAR_MULT[w.star] * (1 + .1 * G.wave), star: w.star, lane: l }; f.spr = S.add.image(p.x, p.y, 'fence').setRotation(p.ang + Math.PI / 2).setDepth(10 + p.y / 10); l.fence = f; R.fences.push(f); }
function breakFence(f) { f.dead = true; f.spr.destroy(); f.lane.fence = null; burst('brown', f.x, f.y, 20); R.fences = R.fences.filter(x => x !== f); }
function rollBoulder() { const l = pick(R.lanes), im = S.add.image(0, 0, 'rock').setScale(1.6).setDepth(700); const hit = new Set(); toast('🪨 Đá lăn!'); S.tweens.addCounter({ from: 0, to: l.total, duration: 3000, onUpdate: tw => { const p = lanePos(l, tw.getValue()); im.setPosition(p.x, p.y).setRotation(tw.getValue() / 20); for (const m of inRange(p.x, p.y, 34, false)) if (!hit.has(m.id)) { hit.add(m.id); dealDamage(m, 80 * (1 + .1 * G.wave), { dt: 'phys', show: 1 }); } for (const rt of R.heroRT.values()) if (!hit.has(rt) && Math.hypot(rt.x - p.x, rt.y - p.y) < 30) { hit.add(rt); damageHero(rt, 40, null); } }, onComplete: () => im.destroy() }); }

// ---------- Đạn ----------
function shoot(key, from, target, speed, onHit, o = {}) {
  let p = R.projPool.find(q => !q.active && q.texture.key === key);
  if (!p) { p = S.add.image(0, 0, key).setDepth(750); R.projPool.push(p); }
  p.setActive(true).setVisible(true).setPosition(from.x, from.y);
  p.tgt = target; p.tx = target.x; p.ty = target.y; p.speed = speed; p.onHit = onHit; p.lob = o.lob; p.sx = from.x; p.sy = from.y; p.t = 0; p.dur = Math.max(.15, Math.hypot(target.x - from.x, target.y - from.y) / speed);
  R.projs.push(p);
}
function releaseProj(p) { p.setActive(false).setVisible(false); p.onHit = null; p.tgt = null; }
function projUpdate(dt) {
  for (const p of R.projs) {
    if (!p.active) { p.done = 1; continue; }
    if (p.tgt && !p.tgt.dead && p.tgt.x !== undefined && !p.lob) { p.tx = p.tgt.x; p.ty = p.tgt.y - 6; }
    p.t += dt; const k = Math.min(1, p.t / p.dur);
    const x = p.sx + (p.tx - p.sx) * k, y = p.sy + (p.ty - p.sy) * k - (p.lob ? Math.sin(Math.PI * k) * 80 : 0);
    p.setRotation(Math.atan2(y - p.y, x - p.x)); p.setPosition(x, y);
    if (k >= 1) { const fn = p.onHit; releaseProj(p); p.done = 1; if (fn) fn(); }
  }
  R.projs = R.projs.filter(p => !p.done);
}

// ---------- Vòng lặp chiến đấu ----------
function combatUpdate(dt) {
  R.statT = (R.statT || 0) - dt; R.statRefresh = R.statT <= 0; if (R.statRefresh) R.statT = .5;
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].t <= R.time) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  for (const m of R.monsters.slice()) monUpdate(m, dt);
  for (const rt of R.heroRT.values()) heroUpdate(rt, dt);
  for (const a of R.allies.slice()) allyUpdate(a, dt);
  if (G.phase === 'night' || R.monsters.length) towerUpdate(dt);
  projUpdate(dt);
  if (R.beltDirty) { R.beltDirty = false; rebuildBelts(); }
  if (G.phase === 'day' && hasW('mirror')) R.mirror = Math.min(120, R.mirror + dt * 1.5);
  // vùng hiệu ứng mặt đất
  const zg = S.zoneG; zg.clear();
  for (const z of R.zones) {
    if (z.until < R.time) { z.dead = 1; continue; }
    if (z.follow) { z.x = z.follow.x; z.y = z.follow.y; }
    z.tick -= dt;
    if (z.tick <= 0) { z.tick = .5; for (const m of inRange(z.x, z.y, z.r, false)) { if (z.dps) dealDamage(m, z.dps * .5, { dt: z.dt || 'phys', aoe: 1 }); if (z.slow) applySlow(m, z.slow, .7); if (z.armRed) { m.armRed = Math.max(m.armRed, z.armRed); m.armRedT = R.time + .7; } } if (z.rain) for (let i = 0; i < 6; i++) { const a = Math.random() * 6.28, r = Math.random() * z.r; burst('orange', z.x + Math.cos(a) * r, z.y + Math.sin(a) * r, 2); } }
    const pulse = .18 + .08 * Math.sin(R.time * 6);
    zg.fillStyle(z.color, pulse); zg.fillCircle(z.x, z.y, z.r); zg.lineStyle(2, z.color, .6); zg.strokeCircle(z.x, z.y, z.r);
  }
  R.zones = R.zones.filter(z => !z.dead);
  // hiệu ứng vẽ
  const g = S.fxG; g.clear();
  for (const v of R.vis) {
    if (v.until < R.time) { v.dead = 1; continue; }
    const k = (R.time - v.t0) / (v.until - v.t0), a = 1 - k;
    if (v.type === 'line') { g.lineStyle(v.w, v.color, a * .8); g.lineBetween(v.x1, v.y1, v.x2, v.y2); }
    else if (v.type === 'ring') { g.lineStyle(3, v.color, a); g.strokeCircle(v.x, v.y, v.r0 + (v.r1 - v.r0) * k); }
    else if (v.type === 'cone') { g.fillStyle(v.color, .35 * a); g.slice(v.x, v.y, v.len, v.a - v.half, v.a + v.half); g.fillPath(); }
  }
  R.vis = R.vis.filter(v => !v.dead);
  // thanh máu
  const b = S.barG; b.clear();
  const bar = (x, y, w, f, c, sh) => { b.fillStyle(0x000000, .6); b.fillRect(x - w / 2 - 1, y - 1, w + 2, 5); b.fillStyle(c); b.fillRect(x - w / 2, y, w * clamp(f, 0, 1), 3); if (sh > 0) { b.fillStyle(0x74b9ff); b.fillRect(x - w / 2, y - 3, w * clamp(sh, 0, 1), 2); } };
  for (const m of R.monsters) if (m.hp < m.maxHp || m.elite) bar(m.x, m.y - 18 * m.size - 4, m.elite ? 34 : 22, m.hp / m.maxHp, m.elite ? 0xffd54f : 0xe74c3c, m.shield / m.maxHp);
  for (const rt of R.heroRT.values()) { if (!rt.dead) bar(rt.x, rt.y - (rt.barDY || 32), 34, rt.hp / rt.st.hp, 0x2ecc71, rt.shield / rt.st.hp); if (rt.cast) { b.fillStyle(0xffd54f); b.fillRect(rt.x - 17, rt.y + 18, 34 * (1 - rt.cast.t / .5), 3); } }
  for (const a of R.allies) if (a.hp < a.maxHp) bar(a.x, a.y - 18, 18, a.hp / a.maxHp, 0x81ecec);
  for (const f of R.fences) bar(f.x, f.y - 22, 30, f.hp / (WEAPON.fence.hp * STAR_MULT[f.star] * (1 + .1 * G.wave)), 0xa1887f);
  if (R.tower) { bar(R.tower.x, Math.min(R.tower.y - 100, (R.towerTop || 0) - 8), 80, G.tower.hp / towerMaxHp(), 0x2ecc71, R.towerShield / towerMaxHp()); if (R.towerHit > 0) { R.towerHit -= dt; R.towerSpr.setTint(0xff9090); } else R.towerSpr.clearTint(); }
  for (const j of R.jobs) { const m = j.mine; b.fillStyle(0x000000, .6); b.fillRect(tc(m.x) - 20, tc(m.y) - 34, 40, 6); b.fillStyle(0xf1c40f); b.fillRect(tc(m.x) - 19, tc(m.y) - 33, 38 * j.t / j.max, 4); }
}

  roll: () => { if (!doRoll()) toast('Thiếu vàng'); render(); },
  xp: () => { if (!buyXP()) toast('Thiếu vàng / tối đa'); render(); },
  auction: id => { const p = Math.ceil(HERO[id].cost * 1.5); if (G.res.gold < p) return toast('Thiếu vàng'); if (!canAddHero(id)) return toast('Hàng chờ đầy'); G.res.gold -= p; addHero(id, 1, p); delete G.cardFlags.auction; render(); },
  wroll: () => { if (!rollWeapons()) toast('Thiếu kim cương'); render(); },
  wlock: () => { G.wshop.locked = !G.wshop.locked; render(); },
  wtake: i => { const o = G.wshop.offers[+i]; addWeapon(o.id, 1, { ...o.val }); G.wshop.offers = []; G.wshop.locked = false; sfx('coin'); render(); },
  wmount: u => { if (G.phase === 'night') return toast('Không đổi vũ khí ban đêm'); const w = allWeapons().find(x => x.uid === +u); if (w) toggleMount(w); render(); },
  wsell: u => { if (!dayOnly()) return; sellWeapon(allWeapons().find(x => x.uid === +u)); render(); },
  smith: id => { const p = smithPrice(id); if (!pay(p)) return toast('Thiếu: ' + costStr(p)); addWeapon(id, 1, { gold: p.gold }); sfx('build'); render(); },
  pickup: i => { const w = G.ground[+i]; if (G.wstore.length >= CONFIG.WSTORE && !G.wslots.some((s, j) => !s && j < CONFIG.AGES[G.tower.age].wslots)) return toast('Kho đầy'); G.ground.splice(+i, 1); addWeapon(w.id, w.star, w.val); render(); },
  cell: id => { if (!dayOnly()) return; upCell(id); render(); },
  respec: () => { respec(); render(); }, suggest: () => { UI.suggest = !UI.suggest; render(); },
  seal: u => { upSeal(G.heroes.find(x => x.uid === +u)); render(); },
  tool: t => { World.setTool(t); if (R.tool) closePanel(); render(); },
  age: () => { const nx = CONFIG.AGES[G.tower.age + 1]; if (!dayOnly()) return; if (!pay(nx.cost)) return toast('Thiếu: ' + costStr(nx.cost)); G.tower.building = G.tower.age + 1; toast(`🏗️ Bắt đầu xây ${nx.name} — hoàn thành lúc bình minh (tòa vẫn chiến đấu bình thường)`); sfx('build'); render(); },
  wall: () => { const c = CONFIG.WALL_COST(G.wall + 1); if (!pay(c)) return toast('Thiếu: ' + costStr(c)); const f = G.tower.hp / towerMaxHp(); G.wall++; recalc(); G.tower.hp = f * towerMaxHp(); sfx('build'); render(); },
  subup: i => { const s = G.subs[+i], c = { stone: 50 * s.lvl, iron: 30 * s.lvl }; if (!pay(c)) return toast('Thiếu: ' + costStr(c)); s.lvl++; World.rebuildAll(); render(); },
  sol: d => { if (G.phase === 'night') return toast('Xếp lính lúc ngày/hoàng hôn'); G.soldiers = clamp(G.soldiers + +d, 0, soldierCap()); render(); },
  heal: n => { const need = Math.min(+n, towerMaxHp() - G.tower.hp), rice = Math.ceil(need / 6); if (need <= 0) return; const r = Math.min(rice, G.res.rice); G.res.rice -= r; G.tower.hp += r * 6; render(); },
  trade: a => { const [f, t] = a.split(':'); if (G.res[f] < 50) return toast('Không đủ ' + RES[f].n); G.res[f] -= 50; gain(t, 50); render(); },
  tab: t => { UI.tab = t; openPanel('info', t); },
  card: id => { closePanel(); World.chooseCard(id); },
  lose: a => { closePanel(); if (a === 'stay') World.afterLose('stay'); else World.afterLose('move', +a); },
  save: s => { if (saveGame(s)) toast('Đã lưu ' + s); renderPanel(); },
  loadIn: s => { closePanel(); World.pause(false); A.mLoad(s); },
  quit: () => { closePanel(); if (S) { game.scene.stop('Game'); } S = null; G = null; game.scene.start('Title'); },
});

// Click toàn cục
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !t.dataset.act || t.disabled) return;
  const f = A[t.dataset.act]; if (f) { sfx('ui'); f(t.dataset.arg); }
});
$('pclose').onclick = () => { if (['cards', 'lose'].includes(UI.panel)) return; if (UI.panel === 'esc') return A.resume(); closePanel(); render(); };
// Tooltip
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('tip');
  if (!t) { tip.style.display = 'none'; return; }
  const r = $('wrap').getBoundingClientRect(), s = UI.scale || 1; tip.textContent = t.dataset.tip; tip.style.display = 'block';
  let x = (e.clientX - r.left) / s + 14, y = (e.clientY - r.top) / s + 14; if (x > 1000) x -= 300; if (y > 600) y -= 120; tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
// Phím tắt
addEventListener('keydown', e => {
  if (!G || !S || $('hud').classList.contains('hide')) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Escape') { e.preventDefault(); if (R.tool || R.placing) { R.tool = null; R.placing = null; S.hoverG.clear(); return render(); } if (UI.panel === 'esc') return A.resume(); if (UI.panel && !['cards', 'lose'].includes(UI.panel)) { closePanel(); return render(); } if (!UI.panel) return A.escMenu(); return; }
  if (UI.panel === 'esc' || UI.panel === 'cards' || UI.panel === 'lose') return;
  const map = { r: 'shop', s: 'smith', c: 'stats', b: 'build', i: 'info', m: 'map' };
  if (map[k]) return A.panel(map[k]);
  if (k === '1' || k === '2' || k === '3') return World.selectIdx(+k - 1);
  if (k === 'q') return World.castQ(); if (k === 'w') return World.castW(); if (k === 'f') return World.castF();
  if (k === ' ') { e.preventDefault(); return World.centerCam(); }
  if (k === 'Enter') return World.ready();
  if (k === 'Delete') { const u = UI.panel === 'hero' ? +UI.arg : R.sel; if (u) A.sell(u); return; }
  if (k === 'F4') { e.preventDefault(); return A.speed(); }
  if (k === 'F2') { e.preventDefault(); G.res.gold += 50; G.res.dia += 30; G.res.core += 2; for (const r of RES_KEYS) gain(r, 200); G.statPts += 3; toast('(Test) +50💰 +30💎 +2🔋 +200 mỗi tài nguyên +3 điểm'); return render(); }
});

// =====================================================================
//  MAIN: khởi tạo Phaser
// =====================================================================
const game = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: CONFIG.W, height: CONFIG.H, backgroundColor: '#101418',
  scale: { mode: Phaser.Scale.NONE }, render: { antialias: true }, disableContextMenu: true,
  scene: [BootScene, TitleScene, GameScene],
});
window.game = game;
window.__T = { get G() { return G; }, R, M: () => M, World, UI, A, CONFIG };
fitWrap(); setTimeout(fitWrap, 100);

</script>
</body>
</html>
